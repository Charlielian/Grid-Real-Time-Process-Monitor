# 上游平台 HTTPS 地址；必须使用 https://，用于登录和同步工单。
base_url: https://nqi.gmcc.net:20443
# Web 服务监听地址。127.0.0.1 仅允许本机访问；如需局域网访问请改为实际网卡地址。
web_host: 127.0.0.1
# Web 服务监听端口，范围 1-65535；常用端口为 5000。
web_port: 5000
# 自动同步轮询间隔（秒），范围 5-3600。
poll_interval_seconds: 60
# 上游登录会话心跳间隔（秒），范围 30-86400。
heartbeat_interval_seconds: 300
# 每次同步查询最近多少小时内更新的工单，范围 1-720。
lookback_hours: 24
# 工单列表默认每页条数，范围 10-500。
page_size: 50
# 是否在监控页面按轮询间隔自动发起同步。
auto_sync: false
# 可选 CA 证书文件路径；不需要自定义 CA 时保持 null。
ca_bundle: null
# 上游页面中用于识别目标流程的标题。
target_process_title: 微网格实时优化流程
# 上游流程的固定标识。
target_process_key: proc_wwg_ssyhlc
# 是否自动领取待领取任务；false 表示只展示并由用户手动领取。
auto_claim_pending_tasks: true
# 后端自动领取轮询间隔（秒），范围 5-3600；仅在 auto_claim_pending_tasks 为 true 时生效。
auto_claim_interval_seconds: 60
