{% extends 'base.html' %}
{% block content %}
<div class="pending-page" data-page-size="50" data-poll-interval="{{ poll_interval_seconds }}" data-auto-claim="{{ 'true' if auto_claim_pending_tasks else 'false' }}">
  <div class="page-header">
    <div>
      <h1>待领取任务</h1>
      <span class="muted">仅显示标题包含「{{ '、'.join(target_title_keywords) }}」的微网格实时优化流程任务；自动领取：{{ '开启' if auto_claim_pending_tasks else '关闭' }}</span>
    </div>
    <button type="button" class="button" id="pending-refresh">刷新</button>
  </div>
  <div id="pending-message" class="muted" role="status"></div>
  <noscript>人工领取</noscript>
  <section class="card table-wrap pending-table-wrap">
    <table class="pending-table"><thead><tr><th>编号</th><th>标题</th><th>当前节点</th><th>创建时间</th><th>到期时间</th><th>操作</th></tr></thead>
    <tbody id="pending-rows"><tr><td colspan="6" class="muted">正在加载…</td></tr></tbody></table>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pending_tasks.js') }}"></script>{% endblock %}
