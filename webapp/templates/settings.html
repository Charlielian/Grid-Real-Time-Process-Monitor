{% extends 'base.html' %}
{% block content %}<h1>系统设置</h1><section class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>轮询间隔（秒）<input type="number" name="poll_interval_seconds" min="5" max="3600" value="{{ config.poll_interval_seconds }}"></label><label>查询最近（小时）<input type="number" name="lookback_hours" min="1" max="720" value="{{ config.lookback_hours }}"></label><label>每页条数<input type="number" name="page_size" min="10" max="500" value="{{ config.page_size }}"></label><label class="checkbox"><input type="checkbox" name="auto_sync" {% if config.auto_sync %}checked{% endif %}> 自动同步</label><button class="button">保存设置</button></form></section>{% endblock %}
