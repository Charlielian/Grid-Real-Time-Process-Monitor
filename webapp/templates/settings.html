{% extends 'base.html' %}
{# 设置表单的字段名必须与 pages.settings 的配置更新参数保持一致。 #}
{% block content %}<h1>系统设置</h1><section class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>轮询间隔（秒）<input type="number" name="poll_interval_seconds" min="5" max="3600" value="{{ config.poll_interval_seconds }}"></label><label>查询最近（小时）<input type="number" name="lookback_hours" min="1" max="720" value="{{ config.lookback_hours }}"></label><label>每页条数<input type="number" name="page_size" min="10" max="500" value="{{ config.page_size }}"></label><label class="checkbox"><input type="checkbox" name="auto_sync" {% if config.auto_sync %}checked{% endif %}> 自动同步</label><label class="checkbox"><input type="checkbox" name="auto_claim_pending_tasks" {% if config.auto_claim_pending_tasks %}checked{% endif %}> 后台自动领取待领取工单</label><label>自动领取轮询间隔（秒）<input type="number" name="auto_claim_interval_seconds" min="5" max="3600" value="{{ config.auto_claim_interval_seconds }}"></label><button class="button">保存设置</button></form></section>{% endblock %}
