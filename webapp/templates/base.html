<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}微网格实时流程监控{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.dashboard') }}">微网格实时流程监控</a>
    {% if current_user %}
    <nav>
      <a href="{{ url_for('web.dashboard') }}">总览</a>
      <a href="{{ url_for('web.orders') }}">工单</a>
      <a href="{{ url_for('web.pending_tasks') }}">待领取</a>
      <a href="{{ url_for('web.settings') }}">设置</a>
      <form method="post" action="{{ url_for('web.logout') }}" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link-button">退出</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
