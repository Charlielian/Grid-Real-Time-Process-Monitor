name: Build Windows executable

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GRID_MONITOR_DATA_DIR: ${{ github.workspace }}\\.ci-data
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --name GridRealtimeMonitor
          --add-data "webapp/templates;webapp/templates"
          --add-data "webapp/static;webapp/static"
          --collect-submodules keyring.backends
          --hidden-import keyring.backends.Windows
          run.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/GridRealtimeMonitor.exe")) {
            throw "PyInstaller did not produce dist/GridRealtimeMonitor.exe"
          }
          Get-Item "dist/GridRealtimeMonitor.exe" | Format-List FullName,Length

      - name: Assemble release package
        shell: pwsh
        run: |
          $package = "dist/GridRealtimeMonitor-windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist/GridRealtimeMonitor.exe" "$package/GridRealtimeMonitor.exe"
          Copy-Item "config.yaml" "$package/config.yaml"
          Copy-Item "DEPLOYMENT.md" "$package/DEPLOYMENT.md"
          $archive = "dist/GridRealtimeMonitor-windows.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Set-Content "${archive}.sha256"
          Get-ChildItem "dist/GridRealtimeMonitor-windows*" | Format-List FullName,Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GridRealtimeMonitor-windows-executable
          path: dist/GridRealtimeMonitor.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: GridRealtimeMonitor-windows-package
          path: |
            dist/GridRealtimeMonitor-windows.zip
            dist/GridRealtimeMonitor-windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: GridRealtimeMonitor-windows-package
          path: dist

      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/GridRealtimeMonitor-windows.zip dist/GridRealtimeMonitor-windows.zip.sha256 --clobber
